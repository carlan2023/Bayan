name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      shops:
        description: "Deploy only these shops (comma-separated names from shops/deploy.json); empty = all not on hold"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend — syntax, tests, seed & API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/bayan_ci
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          for f in $(find src -name '*.js'); do node --check "$f"; done

      - name: Unit & route tests
        # Route tests use the mongo service via MONGO_TEST_URI (each test file
        # creates and drops its own database), so nothing is downloaded in CI.
        run: npm test
        env:
          MONGO_TEST_URI: mongodb://localhost:27017

      - name: Seed database
        # The demo catalogue is opt-in; without --demo a boot seeds nothing.
        run: |
          node src/seed.js | grep -q "skipping seed" || { echo "::error::seed ran without --demo"; exit 1; }
          node src/seed.js --demo

      - name: Provision is idempotent
        # Onboarding a shop twice must converge, not duplicate: a scratch
        # database, the example shop file, run twice.
        run: |
          export MONGODB_URI=mongodb://localhost:27017/bayan_ci_provision PROVISION_OWNER_PASSWORD=ci-owner-pass
          node src/provision.js ../shops/example.json | tee /tmp/p1.log
          node src/provision.js ../shops/example.json | tee /tmp/p2.log
          grep -q "Created admin account owner@acme.example" /tmp/p1.log || { echo "::error::owner not created"; exit 1; }
          grep -q "already an admin" /tmp/p2.log || { echo "::error::second run did not find the owner"; exit 1; }
          grep -q "Catalogue: 0 new, 3 updated" /tmp/p2.log || { echo "::error::second run duplicated the catalogue"; exit 1; }

      - name: Variants migration is a no-op on a fresh seed
        run: |
          node src/migrate-variants.js | tee /tmp/migrate.log
          grep -q "Migrated 0 product" /tmp/migrate.log || { echo "::error::migration touched seeded products"; exit 1; }

      - name: Boot server & smoke-test API
        run: |
          node src/server.js &
          SERVER_PID=$!

          fail() { echo "::error::$1"; kill $SERVER_PID 2>/dev/null; exit 1; }

          # Wait for readiness instead of a fixed sleep: poll /api/health for
          # up to 30s, and fail fast if the process has already died.
          for i in $(seq 1 60); do
            curl -sf localhost:4000/api/health > /dev/null && break
            kill -0 $SERVER_PID 2>/dev/null || fail "server exited during startup"
            [ "$i" = 60 ] && fail "server not ready after 30s"
            sleep 0.5
          done

          # Variant helpers. pick_variant prints one in-stock (>= 3) variant as
          # JSON {id,size,color,stock}; sizes like "One size" contain spaces, so
          # JSON is passed around rather than word-split shell values.
          pick_variant() {
            curl -sf "localhost:4000/api/products?limit=100" | python3 -c '
          import json, sys
          for p in json.load(sys.stdin)["products"]:
              for v in p["variants"]:
                  if v["stock"] >= 3:
                      print(json.dumps({"id": p["id"], "size": v["size"], "color": v["color"], "stock": v["stock"]}))
                      sys.exit()
          sys.exit(1)'
          }
          field() { python3 -c 'import json,sys; print(json.loads(sys.argv[1])[sys.argv[2]])' "$1" "$2"; }
          line() { python3 -c 'import json,sys; v=json.loads(sys.argv[1]); print(json.dumps({"product_id": v["id"], "size": v["size"], "color": v["color"], "qty": int(sys.argv[2])}))' "$1" "$2"; }
          variant_stock() {
            curl -sf "localhost:4000/api/products?ids=$1" | python3 -c '
          import json, sys
          p = json.load(sys.stdin)["products"][0]
          print([v["stock"] for v in p["variants"] if v["size"] == sys.argv[1] and v["color"] == sys.argv[2]][0], p["stock"])' "$2" "$3"
          }

          # health
          curl -sf localhost:4000/api/health | grep -q '"ok":true' || fail "health check failed"

          # catalog + search
          COUNT=$(curl -sf "localhost:4000/api/products" | python3 -c "import json,sys; print(json.load(sys.stdin)['count'])")
          [ "$COUNT" -ge 1 ] || fail "catalog empty after seed"
          curl -sf "localhost:4000/api/products?search=linen" | grep -qi linen || fail "search failed"
          # Partial words fall back to the substring scan ($text is whole-word only)
          curl -sf "localhost:4000/api/products?search=lin" | grep -qi linen \
            || fail "partial-word search fallback failed"

          # storefront config — the client quotes totals from these
          curl -sf localhost:4000/api/config | grep -q '"free_delivery_threshold_cents"' || fail "config endpoint failed"

          # unknown /api routes answer in JSON, not Express's default HTML 404
          NF=$(curl -s -o /dev/null -w "%{http_code}" localhost:4000/api/does-not-exist)
          [ "$NF" = "404" ] || fail "unknown /api route returned $NF, expected 404"
          curl -s localhost:4000/api/does-not-exist | grep -q '"error"' \
            || fail "unknown /api route did not return a JSON error body"

          # bulk lookup by id (used by the cart to re-price its lines)
          IDS_PID=$(curl -sf "localhost:4000/api/products?limit=1" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['products'][0]['id'])")
          IDS_COUNT=$(curl -sf "localhost:4000/api/products?ids=$IDS_PID" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['count'])")
          [ "$IDS_COUNT" = "1" ] || fail "?ids= filter returned $IDS_COUNT products, expected 1"
          BAD_IDS=$(curl -sf "localhost:4000/api/products?ids=not-an-objectid" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['count'])")
          [ "$BAD_IDS" = "0" ] || fail "?ids= with a malformed id returned $BAD_IDS products, expected 0"

          # auth: register + login + me
          TOKEN=$(curl -sf -X POST localhost:4000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI User","email":"ci@test.com","password":"citest1"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])") || fail "register failed"
          curl -sf localhost:4000/api/auth/me -H "Authorization: Bearer $TOKEN" \
            | grep -q ci@test.com || fail "auth/me failed"

          # guest COD order on a real size/colour variant
          V=$(pick_variant) || fail "no in-stock variant after seed"
          ORDER=$(curl -sf -X POST localhost:4000/api/orders \
            -H 'Content-Type: application/json' \
            -d "{\"customer_name\":\"CI Guest\",\"phone\":\"0700000000\",\"address\":\"1 Test St\",\"city\":\"Nairobi\",\"items\":[$(line "$V" 1)]}")
          echo "$ORDER" | grep -q '"payment_method":"cod"' || fail "order creation failed"
          OID=$(echo "$ORDER" | python3 -c "import json,sys; print(json.load(sys.stdin)['order']['id'])")

          # admin: login, stats, order status, non-admin gate
          ADMIN=$(curl -sf -X POST localhost:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@bayan.local","password":"admin123"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])") || fail "admin login failed"
          curl -sf localhost:4000/api/admin/stats -H "Authorization: Bearer $ADMIN" \
            | grep -q revenue_cents || fail "admin stats failed"
          curl -sf -X PATCH "localhost:4000/api/admin/orders/$OID" \
            -H "Authorization: Bearer $ADMIN" -H 'Content-Type: application/json' \
            -d '{"status":"confirmed"}' | grep -q confirmed || fail "order status update failed"
          GATE=$(curl -s -o /dev/null -w "%{http_code}" localhost:4000/api/admin/stats -H "Authorization: Bearer $TOKEN")
          [ "$GATE" = "403" ] || fail "non-admin was not blocked from admin API (got $GATE)"

          # ---- paged admin listings ----
          # Page 1 and 2 must return different products and a consistent total.
          P1=$(curl -sf "localhost:4000/api/admin/products?page=1&limit=2" -H "Authorization: Bearer $ADMIN")
          echo "$P1" | grep -q '"total"' || fail "admin products listing missing pagination metadata"
          TOTAL=$(echo "$P1" | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])")
          [ "$TOTAL" -ge 2 ] || fail "expected at least 2 seeded products, got $TOTAL"
          ID1=$(echo "$P1" | python3 -c "import json,sys; print(json.load(sys.stdin)['products'][0]['id'])")
          ID2=$(curl -sf "localhost:4000/api/admin/products?page=2&limit=2" -H "Authorization: Bearer $ADMIN" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['products'][0]['id'])")
          [ "$ID1" != "$ID2" ] || fail "admin products page 2 returned the same row as page 1"

          # Admin listings are behind the admin gate
          PGATE=$(curl -s -o /dev/null -w "%{http_code}" localhost:4000/api/admin/products -H "Authorization: Bearer $TOKEN")
          [ "$PGATE" = "403" ] || fail "non-admin reached admin products listing (got $PGATE)"

          # Order search by number finds the order created above
          curl -sf "localhost:4000/api/admin/orders?search=$(echo "$ORDER" | python3 -c "import json,sys; print(json.load(sys.stdin)['order']['number'])")" \
            -H "Authorization: Bearer $ADMIN" | grep -q '"customer_name"' || fail "admin order search by number failed"

          # ---- stock accounting per variant: units must never be stranded ----
          # (test/orders.routes.test.js covers this in depth; this re-checks it
          # on the seeded catalogue the deploy will actually boot with)
          V=$(pick_variant) || fail "no in-stock variant for stock accounting"
          SPID=$(field "$V" id); SSIZE=$(field "$V" size); SCOLOR=$(field "$V" color); SSTOCK=$(field "$V" stock)

          read VBEFORE TBEFORE <<< "$(variant_stock "$SPID" "$SSIZE" "$SCOLOR")"
          SORDER=$(curl -sf -X POST localhost:4000/api/orders \
            -H 'Content-Type: application/json' \
            -d "{\"customer_name\":\"CI Stock\",\"phone\":\"0700000001\",\"address\":\"2 Test St\",\"city\":\"Kampala\",\"items\":[$(line "$V" 2)]}") \
            || fail "stock-accounting order failed"
          read VAFTER TAFTER <<< "$(variant_stock "$SPID" "$SSIZE" "$SCOLOR")"
          [ "$VAFTER" = "$((VBEFORE - 2))" ] || fail "variant stock should drop by 2 (was $VBEFORE, now $VAFTER)"
          [ "$TAFTER" = "$((TBEFORE - 2))" ] || fail "derived total should drop by 2 (was $TBEFORE, now $TAFTER)"

          # Cancelling restocks the same variant exactly once
          SOID=$(echo "$SORDER" | python3 -c "import json,sys; print(json.load(sys.stdin)['order']['id'])")
          curl -sf -X PATCH "localhost:4000/api/admin/orders/$SOID" \
            -H "Authorization: Bearer $ADMIN" -H 'Content-Type: application/json' \
            -d '{"status":"cancelled"}' > /dev/null || fail "cancel failed"
          read VRESTOCK TRESTOCK <<< "$(variant_stock "$SPID" "$SSIZE" "$SCOLOR")"
          [ "$VRESTOCK" = "$VBEFORE" ] || fail "cancel should restore the variant to $VBEFORE, got $VRESTOCK"
          [ "$TRESTOCK" = "$TBEFORE" ] || fail "cancel should restore the total to $TBEFORE, got $TRESTOCK"

          # A rejected multi-line order must leave stock exactly as it found it:
          # line 1 is valid, line 2 points at a product that does not exist.
          REJECTED=$(curl -s -o /dev/null -w "%{http_code}" -X POST localhost:4000/api/orders \
            -H 'Content-Type: application/json' \
            -d "{\"customer_name\":\"CI Reject\",\"phone\":\"0700000002\",\"address\":\"3 Test St\",\"city\":\"Kampala\",\"items\":[$(line "$V" 1),{\"product_id\":\"000000000000000000000000\",\"qty\":1}]}")
          [ "$REJECTED" = "400" ] || fail "order with a missing product should be rejected with 400, got $REJECTED"
          read VSAME TSAME <<< "$(variant_stock "$SPID" "$SSIZE" "$SCOLOR")"
          [ "$VSAME" = "$VBEFORE" ] || fail "rejected order leaked variant stock ($VBEFORE -> $VSAME)"

          # A partially-available line (one more than the variant holds) is a
          # 409 naming the real count. Seeded variant stock is < 20, the cap.
          OVER=$(curl -s -X POST localhost:4000/api/orders \
            -H 'Content-Type: application/json' \
            -d "{\"customer_name\":\"CI Over\",\"phone\":\"0700000003\",\"address\":\"4 Test St\",\"city\":\"Kampala\",\"items\":[$(line "$V" $((SSTOCK + 1)))]}")
          echo "$OVER" | grep -q "left in stock" || fail "over-stock line was not rejected with the variant's count: $OVER"

          # Settings drive the money path: a changed delivery fee is quoted by
          # /api/config and charged by POST /api/orders at once.
          curl -sf localhost:4000/api/config | python3 -c '
          import json, sys
          c = json.load(sys.stdin)
          missing = [k for k in ("shop_name", "palette", "fonts", "copy", "departments", "currency", "free_delivery_threshold_cents", "delivery_fee_cents") if k not in c]
          sys.exit("config is missing: %s" % missing if missing else 0)' || fail "/api/config does not serve the settings shape"
          curl -sf -X PUT localhost:4000/api/admin/settings -H "Authorization: Bearer $ADMIN" \
            -H 'Content-Type: application/json' -d '{"delivery_fee_cents": 123400, "free_delivery_threshold_cents": 999999999}' > /dev/null \
            || fail "settings update failed"
          curl -sf localhost:4000/api/config | grep -q '"delivery_fee_cents":123400' || fail "config did not pick up the new fee"
          V=$(pick_variant) || fail "no in-stock variant for the fee check"
          FEE=$(curl -sf -X POST localhost:4000/api/orders -H 'Content-Type: application/json' \
            -d "{\"customer_name\":\"CI Fee\",\"phone\":\"0700000004\",\"address\":\"5 Test St\",\"city\":\"Kampala\",\"items\":[$(line "$V" 1)]}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['order']['delivery_cents'])")
          [ "$FEE" = "123400" ] || fail "order charged delivery $FEE, expected the new fee 123400"

          # Security headers
          curl -sI localhost:4000/api/health | grep -qi "content-security-policy" || fail "CSP header missing"

          kill $SERVER_PID
          echo "All API smoke tests passed."

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---- Deploy: one Railway service per shop, from shops/deploy.json ----
  # Ring 0 (the canary) goes first; ring 1 only after every ring-0 shop built,
  # deployed and answered its health check. `hold: true` in the file skips a
  # shop. A manual run can target specific shops (comma-separated names).
  plan:
    name: Plan shop deploys
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    outputs:
      ring0: ${{ steps.plan.outputs.ring0 }}
      ring1: ${{ steps.plan.outputs.ring1 }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          ONLY: ${{ github.event.inputs.shops }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          shops = json.load(open("shops/deploy.json"))["shops"]
          only = {s.strip() for s in (os.environ.get("ONLY") or "").split(",") if s.strip()}
          live = [s for s in shops if not s.get("hold") and (not only or s["name"] in only)]
          for ring in (0, 1):
              print(f"ring{ring}=" + json.dumps({"include": [s for s in live if s.get("ring", 1) == ring]}))
          PY
          cat "$GITHUB_OUTPUT"

  deploy-canary:
    name: Deploy ${{ matrix.name }} (ring 0)
    needs: plan
    if: fromJSON(needs.plan.outputs.ring0).include[0] != null
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ring0) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        # --ci streams the build and exits non-zero if it fails, so a broken
        # build stops the rollout here instead of reaching the other shops.
        run: railway up --service "$RAILWAY_SERVICE_ID" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets[matrix.railway_token_secret] }}
          RAILWAY_SERVICE_ID: ${{ secrets[matrix.railway_service_secret] }}
      - name: Health check
        if: matrix.url != ''
        run: |
          for i in $(seq 1 30); do
            curl -sf "${{ matrix.url }}/api/health" | grep -q '"ok":true' && exit 0
            sleep 10
          done
          echo "::error::${{ matrix.name }} is not healthy after deploy"; exit 1

  deploy:
    name: Deploy ${{ matrix.name }} (ring 1)
    needs: [plan, deploy-canary]
    # Runs when the canary succeeded, or when there was no canary to run.
    if: always() && needs.plan.result == 'success' && (needs.deploy-canary.result == 'success' || needs.deploy-canary.result == 'skipped') && fromJSON(needs.plan.outputs.ring1).include[0] != null
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ring1) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE_ID" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets[matrix.railway_token_secret] }}
          RAILWAY_SERVICE_ID: ${{ secrets[matrix.railway_service_secret] }}
      - name: Health check
        if: matrix.url != ''
        run: |
          for i in $(seq 1 30); do
            curl -sf "${{ matrix.url }}/api/health" | grep -q '"ok":true' && exit 0
            sleep 10
          done
          echo "::error::${{ matrix.name }} is not healthy after deploy"; exit 1
